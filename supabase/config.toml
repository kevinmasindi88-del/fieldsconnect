
[functions.initialize-mentorship-payment]
enabled = true
verify_jwt = true
import_map = "./functions/initialize-mentorship-payment/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/initialize-mentorship-payment/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/initialize-mentorship-payment/*.html" ]

[functions.paystack-mentorship-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/paystack-mentorship-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/paystack-mentorship-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/paystack-mentorship-webhook/*.html" ]
